name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:ci
    timeout-minutes: 30
  ai-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AI SDK 6 on Node 20
            node: 20
            case: ai6
          - name: Chat plus AI SDK 7 on Node 22
            node: 22
            case: chat-ai7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: bash scripts/check-ai-compatibility.sh ${{ matrix.case }}
    timeout-minutes: 30
  node:
    name: Node ${{ matrix.node }} public-package coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs
    timeout-minutes: 30
  commonjs:
    name: CommonJS on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs --require
    timeout-minutes: 30
